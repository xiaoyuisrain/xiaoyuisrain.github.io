        highlights:
          - Research on LLMs' cultural alignment in humour processing, collaboration with Dr Ekaterina Shutova and Dr Martha Lewis at University of Amsterdam
          - Research on application of LLMs in speech-language therapy for people with aphasia, collaboration with Dr Jie Fu at Xingtai Medical College
      - company: Faculty of Science, University of Amsterdam
        position: Doctoral Researcher
        date:
        start_date: 2021-09
        end_date: 2026-07
        location: Amsterdam, NL
        summary: Conducted interdisciplinary research on evaluating LLMs' metaphor, humour, pragmatic, and cultural understanding in text and multimodal communication.
        highlights:
          - Created theory-driven benchmarks and evaluation protocols for testing linguistic, pragmatic, and cultural capabilities in unimodal and multimodal LLMs.
          - Designed annotation schemes grounded in cognitive and linguistic theories, achieving high reliability (Gwet's AC1 0.84).
          - Led cross-cultural behavioural studies involving 42K human responses across 4K textual and multimodal stimuli.
          - Benchmarked frontier open- and closed-source models using prompting and fine-tuning approaches.
          - Combined statistical analysis, error analysis, and qualitative interpretation to compare human and model behaviour.
      - company: "Institute for Logic, Language and Computation, University of Amsterdam"
        position: Research Intern
        date:
        start_date: 2020-05
        end_date: 2021-03
        location: Amsterdam, NL
        summary: #Developed linguistic resources and evaluation approaches for automated metaphor interpretation.
        highlights:
          - Reframed a widely used, theory-driven manual protocol for metaphor identification (MIPVU) as a word-sense disambiguation (WSD) problem, and operationalised this insight in a novel dataset and evaluation framework for automated metaphor interpretation.
          - Created a resource that led to the BIG-bench metaphor-understanding benchmark and MUNCH project.
